# Restart-35 AI Service
# Docker Compose configuration
#
# Usage:
#   docker-compose up -d
#   docker-compose logs -f ai-service
#   docker-compose down

version: '3.8'

services:
  # AI Service
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restart35-ai-service
    ports:
      - "8000:8000"
    environment:
      # LLM APIs
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Server
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - restart35-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: restart35-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restart35-network

  # Optional: Redis Commander for debugging
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: restart35-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - restart35-network
    profiles:
      - debug

networks:
  restart35-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
