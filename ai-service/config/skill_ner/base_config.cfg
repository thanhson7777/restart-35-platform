[paths]
train = "data/annotations/train.spacy"
dev = "data/annotations/dev.spacy"

[nlp]
lang = "vi"
pipeline = ["tok2vec", "ner"]
batch_size = 1000

[training]
seed = 42
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
max_epochs = 100
patience = 10
gpu_allocator = null
frozen_components = []

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
size = 500

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0

[training.optimizer.learn_rate]
@schedules = "warmup_linear.v1"
warmup_steps = 250
total_steps = 20000
initial_rate = 0.00005

[corpora]

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
max_length = 0

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
max_length = 0
